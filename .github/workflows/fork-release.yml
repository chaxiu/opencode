name: fork-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without leading v"
        required: true
        type: string
      ref:
        description: "Git ref to tag if the release tag does not already exist"
        required: false
        default: "dev"
        type: string

concurrency:
  group: fork-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  OPENCODE_CHANNEL: prod

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Normalize version
        id: meta
        shell: bash
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists on origin
        shell: bash
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists locally"
          else
            git tag "${tag}" "${GITHUB_SHA}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on origin"
          else
            git push origin "refs/tags/${tag}"
          fi

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          notes_file="$(mktemp)"
          cat > "${notes_file}" <<EOF
          Fork release ${tag}.

          Included artifacts:
          - CLI binaries for macOS, Linux, and Windows

          All assets in this release are unsigned.
          EOF

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --title "${tag}" \
              --notes-file "${notes_file}"
          else
            gh release create "${tag}" \
              --title "${tag}" \
              --notes-file "${notes_file}" \
              --verify-tag
          fi

  build-cli:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            build_args: --single
            dist_name: opencode-darwin-arm64
            archive_name: opencode-darwin-arm64.zip
          - name: macos-x64
            os: macos-13
            build_args: --single --baseline
            dist_name: opencode-darwin-x64-baseline
            archive_name: opencode-darwin-x64-baseline.zip
          - name: linux-x64
            os: ubuntu-24.04
            build_args: --single --baseline
            dist_name: opencode-linux-x64-baseline
            archive_name: opencode-linux-x64-baseline.tar.gz
          - name: windows-x64
            os: windows-latest
            build_args: --single --baseline
            dist_name: opencode-windows-x64-baseline
            archive_name: opencode-windows-x64-baseline.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - uses: ./.github/actions/setup-bun

      - name: Build CLI binaries
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: ./script/build.ts ${{ matrix.build_args }}

      - name: Archive CLI binaries (Unix)
        if: runner.os != 'Windows'
        working-directory: packages/opencode
        shell: bash
        run: |
          if [[ "${{ matrix.archive_name }}" == *.tar.gz ]]; then
            tar -C "dist/${{ matrix.dist_name }}/bin" -czf "dist/${{ matrix.archive_name }}" .
          else
            (
              cd "dist/${{ matrix.dist_name }}/bin"
              zip -qr "../../${{ matrix.archive_name }}" .
            )
          fi

      - name: Archive CLI binaries (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/opencode
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/${{ matrix.dist_name }}/bin/*" -DestinationPath "dist/${{ matrix.archive_name }}" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: cli-release-assets-${{ matrix.name }}
          path: packages/opencode/dist/${{ matrix.archive_name }}
          if-no-files-found: error

  publish-assets:
    needs:
      - prepare-release
      - build-cli
    if: >-
      ${{
        always() &&
        needs.prepare-release.result == 'success' &&
        needs.build_cli.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-assets/*)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets found"
            exit 1
          fi
          gh release upload "${{ needs.prepare-release.outputs.tag }}" "${files[@]}" --clobber
