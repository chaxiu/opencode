name: fork-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without leading v"
        required: true
        type: string
      ref:
        description: "Git ref to tag if the release tag does not already exist"
        required: false
        default: "dev"
        type: string

concurrency:
  group: fork-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  OPENCODE_CHANNEL: prod

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Normalize version
        id: meta
        shell: bash
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists on origin
        shell: bash
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists locally"
          else
            git tag "${tag}" "${GITHUB_SHA}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on origin"
          else
            git push origin "refs/tags/${tag}"
          fi

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          notes_file="$(mktemp)"
          cat > "${notes_file}" <<EOF
          Fork release ${tag}.

          Included artifacts:
          - CLI binaries for macOS, Linux, and Windows

          Built on Linux with Bun cross-compile (same approach as upstream publish.yml).
          All assets in this release are unsigned (no Developer ID / Azure Trusted Signing).
          EOF

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --title "${tag}" \
              --notes-file "${notes_file}"
          else
            gh release create "${tag}" \
              --title "${tag}" \
              --notes-file "${notes_file}" \
              --verify-tag
          fi

  # Align with upstream anomalyco/opencode publish.yml build-cli:
  # one Ubuntu job cross-compiles darwin + linux + windows CLI binaries.
  build-cli:
    needs: prepare-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - uses: ./.github/actions/setup-bun

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build CLI binaries (all platforms)
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: ./script/build.ts

      - name: Archive CLI binaries
        working-directory: packages/opencode
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for dir in dist/opencode-linux-*; do
            [ -d "${dir}/bin" ] || continue
            name="$(basename "${dir}")"
            tar -C "${dir}/bin" -czf "dist/${name}.tar.gz" .
            echo "archived ${name}.tar.gz"
          done

          for dir in dist/opencode-darwin-* dist/opencode-windows-*; do
            [ -d "${dir}/bin" ] || continue
            name="$(basename "${dir}")"
            (
              cd "${dir}/bin"
              zip -qr "../../${name}.zip" .
            )
            echo "archived ${name}.zip"
          done

          echo "--- archives ---"
          ls -la dist/*.{zip,tar.gz} 2>/dev/null || {
            echo "No archives produced under dist/"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: cli-release-assets
          path: |
            packages/opencode/dist/opencode-darwin-*.zip
            packages/opencode/dist/opencode-linux-*.tar.gz
            packages/opencode/dist/opencode-windows-*.zip
          if-no-files-found: error

  publish-assets:
    needs:
      - prepare-release
      - build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-release-assets
          path: release-assets

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-assets/*)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets found"
            ls -laR release-assets || true
            exit 1
          fi
          echo "Uploading ${#files[@]} file(s) to ${{ needs.prepare-release.outputs.tag }}:"
          printf ' - %s\n' "${files[@]}"
          gh release upload "${{ needs.prepare-release.outputs.tag }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
