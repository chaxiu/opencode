name: fork-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without leading v"
        required: true
        type: string
      ref:
        description: "Git ref to tag if the release tag does not already exist"
        required: false
        default: "dev"
        type: string

concurrency:
  group: fork-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  OPENCODE_CHANNEL: prod

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Normalize version
        id: meta
        shell: bash
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists on origin
        shell: bash
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists locally"
          else
            git tag "${tag}" "${GITHUB_SHA}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on origin"
          else
            git push origin "refs/tags/${tag}"
          fi

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          notes_file="$(mktemp)"
          cat > "${notes_file}" <<EOF
          Fork release ${tag}.

          Included artifacts:
          - CLI binaries for macOS, Linux, and Windows

          All assets in this release are unsigned.
          EOF

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --title "${tag}" \
              --notes-file "${notes_file}"
          else
            gh release create "${tag}" \
              --title "${tag}" \
              --notes-file "${notes_file}" \
              --verify-tag
          fi

  build-cli:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            target_os: darwin
            archive_glob: packages/opencode/dist/opencode-darwin-*.zip
          - name: linux
            os: ubuntu-24.04
            target_os: linux
            archive_glob: packages/opencode/dist/opencode-linux-*.tar.gz
          - name: windows
            os: windows-latest
            target_os: win32
            archive_glob: packages/opencode/dist/opencode-windows-*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - uses: ./.github/actions/setup-bun

      - name: Build CLI binaries
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: ./script/build.ts --os ${{ matrix.target_os }}

      - name: Ad-hoc sign macOS CLI binaries
        if: runner.os == 'macOS'
        working-directory: packages/opencode
        shell: bash
        run: |
          for bin in dist/opencode-darwin-*/bin/opencode; do
            codesign --force --sign - "$bin"
          done

      - name: Archive CLI binaries (Unix)
        if: runner.os != 'Windows'
        working-directory: packages/opencode
        shell: bash
        run: |
          for dir in dist/opencode-${{ matrix.target_os == 'darwin' && 'darwin' || 'linux' }}-*; do
            [ -d "${dir}/bin" ] || continue
            name="$(basename "${dir}")"
            if [[ "${name}" == opencode-linux-* ]]; then
              tar -C "${dir}/bin" -czf "dist/${name}.tar.gz" .
            else
              (
                cd "${dir}/bin"
                zip -qr "../../${name}.zip" .
              )
            fi
          done

      - name: Archive CLI binaries (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/opencode
        shell: pwsh
        run: |
          Get-ChildItem "dist" -Directory | Where-Object { $_.Name -like "opencode-windows-*" } | ForEach-Object {
            Compress-Archive -Path "$($_.FullName)\bin\*" -DestinationPath "dist\$($_.Name).zip" -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: cli-release-assets-${{ matrix.name }}
          path: ${{ matrix.archive_glob }}
          if-no-files-found: error

  publish-assets:
    needs:
      - prepare-release
      - build-cli
    if: >-
      ${{
        always() &&
        needs.prepare-release.result == 'success' &&
        needs.build_cli.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-assets/*)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets found"
            exit 1
          fi
          gh release upload "${{ needs.prepare-release.outputs.tag }}" "${files[@]}" --clobber
